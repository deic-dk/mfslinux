# root logs in with a key only (mfslinux, 2026-11-27). Ubuntu's sshd_config reads this directory first,
# and the first value wins - so this overrides 'PermitRootLogin yes' that rootpass writes into sshd_config.
# root's installer password (rootpass) then only works at the console. Root is the only account with a password.
PermitRootLogin prohibit-password
